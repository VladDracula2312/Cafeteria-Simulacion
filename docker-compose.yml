version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: cafeteria_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: CafeteriaSimulacionDb
      MYSQL_USER: cafeteria_user
      MYSQL_PASSWORD: cafeteria_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafeteria_backend
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=mysql-db;Port=3306;Database=CafeteriaSimulacionDb;User=cafeteria_user;Password=cafeteria_password_123;
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data:
